<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media query</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            margin:0;
            font-family: cursive;
            background-color: aqua;
            font-style: italic;
        }
        .login-box{
            width:400px;
            margin:100px auto;
            padding:30px;
            background-color: beige;
            border: 2px solid red;
            border-radius: 10px;
        }
        h2{
            text-align: center;
            margin-bottom: 25px;
        }
        label{
            display:block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input{
            width:100%;
            padding:12px;
            background-color: red;
            color:black;
            border: 2px solid green;
            border-radius: 5px;
        }
        @media(max-width:700px){
            .login-box{
                width:90%;
                margin:50px auto;
                padding:20px;
                
            }
            h2{
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>login</h2>
        <form>
            <label>Email</label>
            <input type="email" placeholder="Enter the email">
            <label>password</label>
            <input type="password" placeholder="Enter the password">
            <button type="submit">login</button>
        </form>
    </div>
    
</body>
</html>
