<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOb registration Form</title>
    <link rel="stylesheet" href="job.css" />
</head>

<body>
    <div class="container">
        <h1 class="form-title">Registration</h1>
        <from action="#">
            <div class="main-user-info">
                <div class="user-input-box">
                    <label for="fullName">FullName</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter Full Name" />
                </div>
                <div class="user-input-box">
                    <label for="userNmae">userName</label>
                    <input type="text" id="userName" name="userName" placeholder="Enter User Name" />
                </div>
                <div class="user-input-box">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" placeholder="Enter Email" />
                </div>
                <div class="user-input-box">
                    <label for="phone Number">phone Number</label>
                    <input type="text" id="phone Number" name="phone Number" placeholder="Enter phonr Number" />
                </div>
                <div class="user-input-box">
                    <label for="password">password</label>
                    <input type="text" id="password" name="password" placeholder="Enter password" />
                </div>
                <div class="user-input-box">
                    <label for="confirm password">confirm password</label>
                    <input type="text" id="confirm password" name="confirm password"
                        placeholder="Enter confirm password" />
                </div>
            </div>
            <div class="gender-details-box">
                <span class="gender-title">Gender</span>
                <div class="gender-category">
                    <input type="radio" name="gender" id="male">
                    <label for="male">Male</label>
                    <input type="radio" name="gender" id="Female">
                    <label for="Female">Female</label>
                    <input type="radio" name="gender" id="Other">
                    <label for="Other">Other</label>
                </div>
            </div>
            <div class="from-submit-btn">
                <input type="submit" value="Register">
            </div>

        </from>
    </div>

</body>

</html>
