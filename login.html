<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            margin: 0;
            padding: 0;
            font-family: cursive;
            background-color: pink;
        }
        .login-box{
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            border:2px solid blue;
            outline:2px solid red;
            box-shadow: 0 0 10px red;
            border-radius: 20px;
            color: darkgreen;
            
        }
        .login-box h2{
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
           
        }
        .form-group{
            margin-bottom: 20px;
        }
        label{
            display: block;
            margin-bottom: 8px;
            font-weight: bolder;
        }
        input{
            width:100%;
            padding:12px;
            boder:2px solid green;
            border-radius: 5px;
        }
        button{
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid black;
            background-color: black;
            color:white;
            cursor: pointer;
            font-weight: bold;
            font-size: smaller;
            text-transform: uppercase;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            letter-spacing: 1px;
        }
        button:hover{
            background-color: pink;
            color:white;
        }
        .forget{
            margin-top:20px;
            text-align: center;
        }
        a{
            text-decoration: none;
            color:black;
            font-weight: bold;
        }
        a:hover{
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div class="login-box"><h2>Login Page</h2>
        <form>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Enter the email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter the Password">
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="forget">
            <a href="#">Forget Password?</a>
        </div>
        </div>
    
</body>
</html>
